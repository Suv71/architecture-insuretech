apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      containers:
      - name: scaletestapp
        image: scaletestapp:1.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "30m"
            memory: "20Mi"
          limits:
            cpu: "50m"
            memory: "30Mi"
